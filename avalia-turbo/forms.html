<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado · AvaliaTurbo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', Arial, sans-serif;
    background-color: #E4F3F4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #1A1A1A;
  }

  .page {
    width: 100%;
    max-width: 560px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .brand img {
    height: 40px;
    width: auto;
    display: block;
  }

  .card {
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(7, 18, 36, 0.08);
    overflow: hidden;
    text-align: center;
  }

  .card-body {
    padding: 48px 40px 40px;
  }

  .icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #118195;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }

  .icon-circle svg {
    width: 28px;
    height: 28px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #071224;
    margin-bottom: 20px;
    line-height: 1.3;
  }

  p {
    font-size: 15px;
    color: #4A4A4A;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  p:last-child {
    margin-bottom: 0;
  }

  .card-footer {
    background: #F7FAFB;
    border-top: 1px solid #EDEDED;
    padding: 18px 24px;
    font-size: 13px;
    color: #4A4A4A;
  }

  .card-footer strong {
    color: #071224;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <img src="https://unsubscribe.amostrando.com.br/avalia-turbo/logo-azul.png" alt="AvaliaTurbo">
    </div>

    <div class="card">
      <div class="card-body">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L9 17L4 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1>Recebemos sua resposta!</h1>

        <p>Obrigado por preencher o formulário. Sua resposta já chegou até a gente.</p>
        <p>Nossa equipe vai analisar as informações e, se for preciso, entra em contato em breve.</p>
      </div>

      <div class="card-footer">
        <strong>AvaliaTurbo</strong> · Avalie mais. Trabalhe menos.
      </div>
    </div>
  </div>
</body>
</html>
