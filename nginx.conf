server {
    listen 80;

    root /usr/share/nginx/html;

    location = / {
        return 302 /amostrando/;
    }

    location /amostrando/ {
        index index.html;
        try_files $uri $uri/ /amostrando/index.html;
    }

    location /avaelite/ {
        index avaelite.html;
        try_files $uri $uri/ /avaelite/index.html;
    }
    location /avalia-turbo/ {
        index index.html;
        try_files $uri $uri/ /avalia-turbo/index.html;
    }
}